<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastAPI - RAG - TMDB</title>
    <link href="{{url_for('static',path='/css/style.css')}}" rel="stylesheet" />
    
</head>
<body>

    <form action='/post_tmdb' method='POST'>
  <label for="fname">Which movie are you looking for ? </label><br>
  <input type="text" id="fname" name="text_request"><br>
  <input type="submit" value="Submit">
  </form>

    {{ jackpot }}
    
    <ul>
        {% for item in movie_stat %}
            <li>{{ item.title }}</li>
            <li>{{ item.release_date }}</li>
            <li>{{ item.score }}</li>
            {% endfor %}
    </ul>
    
    
</body>
</html>
