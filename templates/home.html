<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastAPI - RAG - TMDB</title>
    <link href="{{url_for('static',path='/css/style.css')}}" rel="stylesheet" />
    
</head>
<body>

    <div class="RAG_TITLE mt-5">
        <h1 class="text-center h1_rag_title">
            RAG App with TMDB
        </h1>
    </div>

    <form action='/post_tmdb' method='POST' class="input_rag">
  <label for="fname">Which movie are you looking for ? </label><br>
  <input type="text" id="fname" name="text_request"><br>
  <input type="submit" value="Submit"><br>
  </form>

    {{ jackpot }}
    
    <ul>
        {% for item in movie_stat %}
            <li><img src="https://image.tmdb.org/t/p/w92{{ item.poster }}" alt="{{ item.title }} poster"></li>
            <li>{{ item.title }}</li>
            <li>{{ item.release_date }}</li>
            <li>{{ item.score }}</li>
            {% endfor %}
    </ul>
    
    
</body>
</html>
